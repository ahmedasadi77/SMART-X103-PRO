-weight:900;color:var(--navy);margin-top:11px;line-height:1.2}.kpi-note{font-size:10px;color:var(--muted);margin-top:5px}.dashboard-grid{grid-template-columns:1.45fr 1fr;align-items:start}.panel{padding:19px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.panel-title{font-weight:900;font-size:14px;color:var(--navy)}.panel-sub{font-size:10px;color:var(--muted);margin-top:2px}.chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding:12px 4px 0;border-bottom:1px solid var(--line)}.bar-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}.bar{width:min(34px,70%);min-height:4px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#e8bb45,#bd8b1f);position:relative}.bar-label{font-size:9px;color:var(--muted)}.bar-val{font-size:9px;color:#53677d}.list{display:flex;flex-direction:column;gap:10px}.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eff2f6}.list-row:last-child{border:0}.list-main{display:flex;align-items:center;gap:10px;min-width:0}.avatar{width:36px;height:36px;border-radius:12px;background:#edf3f9;color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:12px;flex-shrink:0}.list-name{font-size:11px;font-weight:800;color:var(--ink)}.list-meta{font-size:9px;color:var(--muted);margin-top:2px}.status{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:30px;font-size:9px;font-weight:800;white-space:nowrap}.status:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.s-new{color:#2869a7;background:#eaf3ff}.s-progress{color:#a56a08;background:#fff5dc}.s-done,.s-paid{color:#137b53;background:#e8f7ef}.s-wait,.s-unpaid{color:#b13b42;background:#fff0f0}.s-cancel{color:#64748b;background:#eff2f5}.s-low{color:#b45309;background:#fff2df}.table-card{overflow:hidden}.table-tools{padding:15px 17px;display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line)}.search{position:relative;min-width:220px;flex:1;max-width:370px}.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 35px 9px 12px;background:#fafbfd;outline:none;font-size:11px}.search:before{content:"⌕";position:absolute;right:12px;top:4px;font-size:20px;color:#8998a8}.filter{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 11px;font-size:11px;color:#52657b}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:720px}th{background:#f8fafc;color:#718096;font-size:10px;font-weight:900;text-align:right;padding:13px 16px;white-space:nowrap}td{padding:13px 16px;border-top:1px solid #edf1f5;font-size:11px;color:#40546a;white-space:nowrap}tbody tr:hover{background:#fbfcfe}.td-main{font-weight:800;color:var(--navy)}.td-sub{font-size:9px;color:#91a0af;margin-top:2px}.row-actions{display:flex;gap:5px}.empty{text-align:center;padding:40px 15px;color:var(--muted);font-size:12px}.empty b{display:block;font-size:27px;margin-bottom:8px}.info-strip{display:flex;align-items:center;gap:10px;padding:13px 15px;border-radius:12px;background:#fff8e8;border:1px solid #f2e2b8;color:#795814;font-size:10px;line-height:1.8;margin-bottom:15px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;font-weight:800;color:#52657b}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe6ee;border-radius:10px;padding:10px 11px;outline:none;background:#fff;color:var(--ink);font-size:11px}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#d4a42e;box-shadow:0 0 0 3px #d7a92820}.modal{border:0;border-radius:18px;padding:0;width:min(640px,calc(100vw - 28px));box-shadow:0 24px 80px #071a3040}.modal::backdrop{background:#071a3080;backdrop-filter:blur(3px)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0;color:var(--navy);font-size:16px}.modal-body{padding:20px}.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start}.close-x{border:0;background:#f1f4f7;border-radius:9px;width:32px;height:32px;color:#52657b;font-size:18px}.notice{font-size:10px;line-height:1.8;color:#6c7d90;background:#f7f9fb;padding:10px 12px;border-radius:10px;margin-top:12px}.site-hero{background:linear-gradient(120deg,#0b1f36,#1c4268);border-radius:20px;color:#fff;padding:34px;position:relative;overflow:hidden;margin-bottom:16px}.site-hero:after{content:"";position:absolute;width:260px;height:260px;left:-50px;top:-100px;border:35px solid #d7a92820;border-radius:50%}.site-hero h2{font-size:36px;font-weight:1000;margin:6px 0}.site-hero p{max-width:630px;color:#cad7e4;font-size:12px;line-height:2}.site-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.site-tag{border:1px solid #ffffff35;background:#ffffff12;padding:7px 12px;border-radius:30px;font-size:10px;color:#e5edf5}.site-cards{grid-template-columns:repeat(4,minmax(0,1fr))}.site-card{padding:17px}.site-card b{font-size:12px;color:var(--navy)}.site-card p{font-size:10px;color:var(--muted);line-height:1.8;margin-bottom:0}.report-box{padding:18px}.report-stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:11px}.report-stat:last-child{border:0}.progress{height:8px;background:#edf1f5;border-radius:20px;overflow:hidden;margin-top:7px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#d4a128,#f1c653);border-radius:20px}.mobile-nav{display:none}.toast{position:fixed;bottom:22px;left:22px;background:#0b1f36;color:#fff;padding:12px 17px;border-radius:12px;box-shadow:var(--shadow);font-size:11px;z-index:100;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:none}.footer-note{margin-top:18px;text-align:center;color:#98a5b3;font-size:9px}.danger-zone{border:1px solid #f0d0d2;background:#fff8f8;border-radius:14px;padding:16px}.danger-zone b{color:#a52d35;font-size:12px}.danger-zone p{font-size:10px;color:#84666a;line-height:1.8}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-grid{grid-template-columns:1fr}.site-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.topbar{height:66px;padding:0 14px}.brand-mark{width:40px;height:40px}.brand-name{font-size:17px}.top-pill{display:none}.layout{display:block;min-height:calc(100vh - 66px)}.sidebar{display:none}.main{padding:17px 13px 90px}.page-title{font-size:21px}.mobile-nav{display:flex;position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);z-index:40;justify-content:space-around;padding:7px 3px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -5px 20px #0b1f3610}.mobile-nav button{background:none;border:0;color:#7d8b9b;font-size:9px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:48px}.mobile-nav button span:first-child{font-size:17px}.mobile-nav button.active{color:var(--navy)}.kpis{gap:9px}.kpi{padding:13px}.kpi-value{font-size:22px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.site-hero{padding:25px 20px}.site-hero h2{font-size:29px}.site-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.table-tools{align-items:stretch}.search{max-width:none;min-width:100%}.page-head{margin-bottom:16px}.actions{width:100%}.actions .btn{flex:1}.panel{padding:14px}}
@media(max-width:390px){.kpis{grid-template-columns:1fr 1fr}.kpi-top{font-size:9px}.kpi-icon{width:30px;height:30px}.kpi-value{font-size:20px}.site-cards{grid-template-columns:1fr}}

<body>
<div class="app-shell">
<header class="topbar">
  <div class="brand"><div class="brand-mark">X103</div><div><div class="brand-name">SMART <span style="color:#e14a4e">X</span><span style="color:#f2c34d">103</span></div><div class="brand-sub">نظام إدارة ورشة الشاحنات والمعدات الثقيلة</div></div></div>
  <div class="top-actions"><span class="top-pill">● نسخة تشغيل محلية — قابلة للتطوير</span><button class="icon-btn" title="الرئيسية" onclick="navigate('dashboard')">⌂</button><button class="icon-btn" title="نسخة احتياطية" onclick="exportBackup()">⇩</button></div>
</header>
<div class="layout">
<aside class="sidebar">
  <div class="side-label">الرئيسية</div>
  <button class="nav-item active" data-page="dashboard"><span class="nav-icon">▦</span>لوحة التحكم</button>
  <button class="nav-item" data-page="website"><span class="nav-icon">◈</span>موقع الورشة</button>
  <div class="side-label">إدارة الورشة</div>
  <button class="nav-item" data-page="customers"><span class="nav-icon">♙</span>العملاء</button>
  <button class="nav-item" data-page="vehicles"><span class="nav-icon">▰</span>الشاحنات والمركبات</button>
  <button class="nav-item" data-page="jobs"><span class="nav-icon">⚙</span>أوامر الصيانة <span class="nav-count" id="jobCount">0</span></button>
  <button class="nav-item" data-page="invoices"><span class="nav-icon">▤</span>الفواتير</button>
  <button class="nav-item" data-page="inventory"><span class="nav-icon">▣</span>قطع الغيار والمخزون</button>
  <button class="nav-item" data-page="appointments"><span class="nav-icon">◷</span>المواعيد</button>
  <button class="nav-item" data-page="team"><span class="nav-icon">♧</span>الموظفون</button>
  <div class="side-label">المتابعة والتقارير</div>
  <button class="nav-item" data-page="reports"><span class="nav-icon">▥</span>التقارير والإحصائيات</button>
  <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>الإعدادات والنسخ</button>
  <div class="sidebar-foot"><b>SMART X103 PRO</b><p>نظام قابل للتوسع لإدارة الصيانة والعملاء والمخزون والحسابات من مكان واحد.</p><button class="btn btn-gold btn-sm" style="width:100%" onclick="navigate('settings')">إدارة النظام ←</button></div>
</aside>
<main class="main" id="main"></main>
</div>
<nav class="mobile-nav" id="mobileNav">
  <button data-page="dashboard" class="active"><span>▦</span>الرئيسية</button><button data-page="customers"><span>♙</span>العملاء</button><button data-page="jobs"><span>⚙</span>الصيانة</button><button data-page="invoices"><span>▤</span>الفواتير</button><button data-page="settings"><span>☰</span>المزيد</button>
</nav>
</div>
<dialog class="modal" id="modal"><div class="modal-head"><h3 id="modalTitle">إضافة</h3><button class="close-x" type="button" onclick="closeModal()">×</button></div><form id="modalForm"><div class="modal-body" id="modalBody"></div><div class="modal-foot"><button class="btn btn-primary" type="submit">حفظ البيانات</button><button class="btn btn-light" type="button" onclick="closeModal()">إلغاء</button></div></form></dialog>
<div class="toast" id="toast"></div>
<script>
const DB_KEY='smart_x103_pro_v1';
const blankDB=()=>({customers:[],vehicles:[],jobs:[],invoices:[],inventory:[],appointments:[],team:[],settings:{name:'SMART X103',manager:'أحمد',phone:'0569344849',city:'الرياض',address:'السلي، الرياض، المملكة العربية السعودية',email:'',currency:'ر.س',tax:15}});
let db=loadDB(),currentPage='dashboard',activeFilter='all',searchTerm='';
function loadDB(){try{const raw=localStorage.getItem(DB_KEY);if(raw){const v=JSON.parse(raw);return {...blankDB(),...v,settings:{...blankDB().settings,...(v.settings||{})}}}}catch(e){}return blankDB()}
function saveDB(){localStorage.setItem(DB_KEY,JSON.stringify(db));updateBadges()}
function updateBadges(){const n=db.jobs.filter(x=>!['مكتمل','ملغي'].includes(x.status)).length;const el=document.getElementById('jobCount');if(el)el.textContent=n}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return (Number(v)||0).toLocaleString('ar-SA',{maximumFractionDigits:2})+' '+(db.settings.currency||'ر.س')}
function dateNow(){return new Date().toISOString().slice(0,10)}
function fmtDate(v){if(!v)return '—';try{return new Date(v+'T00:00:00').toLocaleDateString('ar-SA')}catch(e){return v}}
function uid(prefix='X'){return prefix+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,5).toUpperCase()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function navigate(page){currentPage=page;searchTerm='';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
function pageHead(title,desc,buttons=''){return `<div class="page-head"><div><div class="eyebrow">SMART X103 / MANAGEMENT</div><div class="page-title">${title}</div><div class="page-desc">${desc}</div></div><div class="actions">${buttons}</div></div>`}
function btn(label,action,kind='primary',icon='＋'){return `<button class="btn btn-${kind}" onclick="${action}">${icon} ${label}</button>`}
function statusClass(s){if(['مكتمل','مدفوع','تم التأكيد','على رأس العمل'].includes(s))return 's-done';if(['قيد التنفيذ','قيد الصيانة','مدفوع جزئياً'].includes(s))return 's-progress';if(['بانتظار الموافقة','جديد','مجدول'].includes(s))return 's-new';if(['غير مدفوع','متأخر','ملغي'].includes(s))return s==='ملغي'?'s-cancel':'s-wait';return 's-cancel'}
function statusPill(s){return `<span class="status ${statusClass(s)}">${esc(s||'—')}</span>`}
function customerName(id){return db.customers.find(x=>x.id===id)?.name||'عميل غير محدد'}
function vehicleName(id){const v=db.vehicles.find(x=>x.id===id);return v?[v.make,v.model,v.plate].filter(Boolean).join(' · '):'مركبة غير محددة'}
function render(){const m=document.getElementById('main');const pages={dashboard:renderDashboard,website:renderWebsite,customers:()=>renderTable('customers'),vehicles:()=>renderTable('vehicles'),jobs:()=>renderTable('jobs'),invoices:()=>renderTable('invoices'),inventory:()=>renderTable('inventory'),appointments:()=>renderTable('appointments'),team:()=>renderTable('team'),reports:renderReports,settings:renderSettings};m.innerHTML=(pages[currentPage]||renderDashboard)();updateBadges()}
function renderDashboard(){const active=db.jobs.filter(x=>!['مكتمل','ملغي'].includes(x.status)).length;const paid=db.invoices.filter(x=>x.status==='مدفوع').reduce((s,x)=>s+Number(x.total||x.amount||0),0);const unpaid=db.invoices.filter(x=>x.status!=='مدفوع').reduce((s,x)=>s+Number(x.total||x.amount||0),0);const low=db.inventory.filter(x=>Number(x.qty)<=Number(x.min||0)).length;const recent=[...db.jobs].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,5);const months=lastMonths();const max=Math.max(1,...months.map(x=>x.total));return `${pageHead('لوحة التحكم','نظرة شاملة على أداء الورشة وحالة الأعمال اليوم.',btn('أمر صيانة جديد',"openForm('jobs')")+btn('فاتورة جديدة',"openForm('invoices')",'gold','＋'))}
<div class="grid kpis">

function lastMonths(){const out=[];const now=new Date();for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const key=d.toISOString().slice(0,7);const total=db.invoices.filter(x=>x.status==='مدفوع'&&(x.date||'').slice(0,7)===key).reduce((s,x)=>s+Number(x.total||x.amount||0),0);out.push({label:d.toLocaleDateString('ar-SA',{month:'short'}),total})}return out}

function getRows(type){return db[type]||[]}
function fieldValue(type,row,key,kind){const v=row[key];if(kind==='customer')return customerName(v);if(kind==='vehicle')return vehicleName(v);if(kind==='job')return db.jobs.find(x=>x.id===v)?.number||'—';if(kind==='date')return fmtDate(v);if(kind==='status')return statusPill(v);if(kind==='money')return money(v);if(key==='customerId')return customerName(v);if(key==='vehicleId')return vehicleName(v);if(key==='total')return money(v||0);return esc(v??'—')}
function renderTable(type){const c=configs[type],rows=getRows(type);const extra=type==='inventory'?`<span class="status s-low">${rows.filter(x=>Number(x.qty)<=Number(x.min||0)).length} أصناف منخفضة</span>`:'';return `${pageHead(c.title,c.desc,btn(c.add,`openForm('${type}')`))}${extra?`<div style="margin-bottom:12px">${extra}</div>`:''}<section class="card table-card"><div class="table-tools"><div class="search"><input id="tableSearch" placeholder="ابحث في ${c.title}..." value="${esc(searchTerm)}" oninput="searchTerm=this.value;filterRows('${type}')"></div><div class="actions"><button class="btn btn-light btn-sm" onclick="exportCSV('${type}')">⇩ تصدير CSV</button><select class="filter" id="tableFilter" onchange="activeFilter=this.value;filterRows('${type}')"><option value="all">كل السجلات</option>${(type==='jobs'?['جديد','بانتظار الموافقة','قيد التنفيذ','مكتمل','ملغي']:type==='invoices'?['غير مدفوع','مدفوع','مدفوع جزئياً']:type==='appointments'?['جديد','تم التأكيد','مكتمل','ملغي']:type==='inventory'?['منخفض']:[]).map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="table-wrap"><table><thead><tr>${c.cols.map(col=>`<th>${col[1]}</th>`).join('')}<th>إجراءات</th></tr></thead><tbody id="tableBody">${rows.length?rows.map(r=>rowHTML(type,r)).join(''):`<tr><td colspan="${c.cols.length+1}"><div class="empty"><b>＋</b>لا توجد بيانات حتى الآن. أضف أول سجل للبدء.</div></td></tr>`}</tbody></table></div></section><div class="footer-note">تُحفظ البيانات في هذا المتصفح على هذا الجهاز.</div>`}
function rowHTML(type,r){const c=configs[type];return `<tr data-search="${esc(JSON.stringify(r).toLowerCase())}" data-status="${esc(r.status||'')}">${c.cols.map(col=>`<td>${col[2]==='primary'?`<div class="td-main">${fieldValue(type,r,col[0],col[2])}</div>`:fieldValue(type,r,col[0],col[2])}</td>`).join('')}<td><div class="row-actions"><button class="btn btn-light btn-sm" onclick="editRecord('${type}','${r.id}')">✎ تعديل</button>${type==='invoices'?`<button class="btn btn-gold btn-sm" onclick="printInvoice('${r.id}')">طباعة</button>`:''}<button class="btn btn-danger btn-sm" onclick="deleteRecord('${type}','${r.id}')">حذف</button></div></td></tr>`}
function filterRows(type){const q=(searchTerm||'').toLowerCase();const f=document.getElementById('tableFilter')?.value||'all';document.querySelectorAll('#tableBody tr[data-search]').forEach(tr=>{tr.style.display=(tr.dataset.search.includes(q)&&(f==='all'||(f==='منخفض'?Number(getRows(type).find(r=>JSON.stringify(r).toLowerCase()===tr.dataset.search)?.qty||0)<=Number(getRows(type).find(r=>JSON.stringify(r).toLowerCase()===tr.dataset.search)?.min||0):tr.dataset.status===f)))?'':'none'})}
function optionsFor(kind,selected=''){let arr=[];if(kind==='customer')arr=db.customers;if(kind==='vehicle')arr=db.vehicles;if(kind==='job')arr=db.jobs;if(kind==='team')arr=db.team;return `<option value="">— اختر —</option>`+arr.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(kind==='vehicle'?vehicleName(x.id):kind==='job'?(x.number||x.id):x.name||'')}</option>`).join('')}
function inputFor(f,value=''){const [key,label,type,required,choices]=f;const req=required?'required':'';if(['textarea'].includes(type))return `<div class="field full"><label>${label}</label><textarea name="${key}" ${req}>${esc(value||'')}</textarea></div>`;if(['select','customer','vehicle','job','team'].includes(type)){const opts=type==='select'?(choices||[]).map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join(''):optionsFor(type,value);return `<div class="field"><label>${label}</label><select name="${key}" ${req}>${opts}</select></div>`}return `<div class="field"><label>${label}</label><input name="${key}" type="${type}" value="${esc(value??'')}" ${req} ${type==='number'?'step="any" min="0"':''}></div>`}
function openForm(type,id=null){const c=configs[type];if(!c)return;const old=id?db[type].find(x=>x.id===id):null;document.getElementById('modalTitle').textContent=(old?'تعديل ':'إضافة ')+c.add.replace('جديد','').replace('إضافة ','').replace('فتح أمر ','');const body=document.getElementById('modalBody');body.innerHTML=`<div class="form-grid">${c.fields.map(f=>inputFor(f,old?.[f[0]]??(f[0]==='date'||f[0]==='createdAt'?dateNow():f[0]==='tax'?db.settings.tax:''))).join('')}</div><div class="notice">راجع البيانات قبل الحفظ. يمكنك تعديل السجل لاحقاً من جدول ${c.title}.</div>`;const form=document.getElementById('modalForm');form.dataset.type=type;form.dataset.id=id||'';document.getElementById('modal').showModal()}

document.getElementById('modalForm').addEventListener('submit',e=>{e.preventDefault();const form=e.currentTarget,type=form.dataset.type,id=form.dataset.id;const data=Object.fromEntries(new FormData(form).entries());const c=configs[type];c.fields.forEach(f=>{if(f[2]==='number')data[f[0]]=data[f[0]]===''?'':Number(data[f[0]])});if(type==='invoices'){const amount=Number(data.amount||0),tax=Number(data.tax||0);data.total=amount+(amount*tax/100)}if(type==='jobs'){data.number=id?(db.jobs.find(x=>x.id===id)?.number):'WO-'+String(Date.now()).slice(-6);data.status=data.status||'جديد';data.createdAt=data.createdAt||dateNow()}if(type==='invoices'){data.number=id?(db.invoices.find(x=>x.id===id)?.number):'INV-'+String(Date.now()).slice(-6)}if(type==='inventory'){data.qty=Number(data.qty||0);data.min=Number(data.min||0)}if(id){const i=db[type].findIndex(x=>x.id===id);db[type][i]={...db[type][i],...data}}else db[type].unshift({id:uid(type.slice(0,2).toUpperCase()),...data,createdAt:data.createdAt||dateNow()});saveDB();closeModal();render();toast('تم حفظ البيانات بنجاح')});

function deleteRecord(type,id){if(!confirm('هل أنت متأكد من حذف هذا السجل؟ لا يمكن التراجع عن الحذف.'))return;db[type]=db[type].filter(x=>x.id!==id);saveDB();render();toast('تم حذف السجل')}
function renderReports(){const paid=db.invoices.filter(x=>x.status==='مدفوع').reduce((s,x)=>s+Number(x.total||0),0),unpaid=db.invoices.filter(x=>x.status!=='مدفوع').reduce((s,x)=>s+Number(x.total||0),0),completed=db.jobs.filter(x=>x.status==='مكتمل').length,active=db.jobs.filter(x=>!['مكتمل','ملغي'].includes(x.status)).length,low=db.inventory.filter(x=>Number(x.qty)<=Number(x.min||0));const totalJobs=db.jobs.length||0;return `${pageHead('التقارير والإحصائيات','ملخص تشغيلي ومالي مبني على البيانات المسجلة في النظام.',`<button class="btn btn-light" onclick="window.print()">⎙ طباعة التقرير</button>`)}<div class="grid kpis"><div class="card kpi" style="--tone:#e5f6ee"><div class="kpi-top">الإيرادات المحصلة</div><div class="kpi-value" style="font-size:21px">${money(paid)}</div><div class="kpi-note">فواتير بحالة مدفوع</div></div><div class="card kpi" style="--tone:#fff0f0"><div class="kpi-top">المبالغ المستحقة</div><div class="kpi-value" style="font-size:21px">${money(unpaid)}</div><div class="kpi-note">فواتير غير مكتملة السداد</div></div><div class="card kpi" style="--tone:#eaf2fb"><div class="kpi-top">أوامر مكتملة</div><div class="kpi-value">${completed}</div><div class="kpi-note">من أصل ${totalJobs} أمر</div></div><div class="card kpi" style="--tone:#fff4d8"><div class="kpi-top">أعمال قيد المتابعة</div><div class="kpi-value">${active}</div><div class="kpi-note">أوامر لم تُغلق بعد</div></div></div><div class="grid dashboard-grid"><section class="card report-box"><div class="panel-title">مؤشرات إنجاز أوامر الصيانة</div><div class="report-stat"><span>نسبة الأوامر المكتملة</span><b>${totalJobs?Math.round(completed/totalJobs*100):0}%</b></div><div class="progress"><span style="width:${totalJobs?completed/totalJobs*100:0}%"></span></div><div class="report-stat"><span>العملاء المسجلون</span><b>${db.customers.length}</b></div><div class="report-stat"><span>المركبات المسجلة</span><b>${db.vehicles.length}</b></div><div class="report-stat"><span>المواعيد</span><b>${db.appointments.length}</b></div></section><section class="card report-box"><div class="panel-title">تنبيه المخزون</div>${low.length?low.map(x=>`<div class="report-stat"><span>${esc(x.name)} <small style="color:#9aa8b7">(${esc(x.sku||'بدون SKU')})</small></span><b style="color:#b45309">${x.qty} / ${x.min}</b></div>`).join(''):'<div class="empty"><b>✓</b>لا توجد أصناف تحت حد إعادة الطلب</div>'}</section></div><div class="info-strip" style="margin-top:15px">ℹ هذه تقارير تشغيلية أولية وليست قوائم مالية أو إقرارات ضريبية معتمدة. تأكد من مراجعة المحاسب قبل الاعتماد الرسمي.</div>`}
function renderSettings(){const s=db.settings;return `${pageHead('الإعدادات والنسخ الاحتياطي','تخصيص بيانات الورشة وحماية بيانات النظام.',`<button class="btn btn-gold" onclick="exportBackup()">⇩ تنزيل نسخة احتياطية</button>`)}<div class="grid dashboard-grid"><section class="card panel"><div class="panel-head"><div><div class="panel-title">بيانات الورشة</div><div class="panel-sub">تظهر هذه المعلومات في واجهة الموقع والفواتير.</div></div></div><form id="settingsForm"><div class="form-grid">${[['name','اسم الورشة'],['manager','اسم المدير'],['phone','رقم الهاتف'],['city','المدينة'],['address','العنوان'],['email','البريد الإلكتروني'],['currency','العملة'],['tax','نسبة الضريبة %']].map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" value="${esc(s[k]??'')}" ${k==='tax'?'type="number" min="0" max="100" step="any"':'type="text"'}></div>`).join('')}</div><div style="margin-top:15px"><button class="btn btn-primary">حفظ الإعدادات</button></div></form></section><section class="card panel"><div class="panel-head"><div><div class="panel-title">النسخ والاستعادة</div><div class="panel-sub">احتفظ بنسخة خارج الجهاز بشكل دوري.</div></div></div><div class="list"><div class="list-row"><div><div class="list-name">تنزيل نسخة احتياطية كاملة</div><div class="list-meta">ملف JSON يتضمن جميع السجلات والإعدادات</div></div><button class="btn btn-gold btn-sm" onclick="exportBackup()">تنزيل</button></div><div class="list-row"><div><div class="list-name">استعادة نسخة احتياطية</div><div class="list-meta">استبدال البيانات الحالية بمحتويات النسخة</div></div><label class="btn btn-light btn-sm">اختيار ملف<input type="file" accept="application/json,.json" hidden onchange="importBackup(event)"></label></div></div><div class="notice">نصيحة: نزّل نسخة احتياطية بعد إدخال بيانات مهمة، واحفظها في مكان آمن.</div><div class="danger-zone" style="margin-top:18px"><b>منطقة الإجراءات الحساسة</b><p>إعادة ضبط النظام ستحذف كل العملاء والمركبات والفواتير وأوامر الصيانة والمخزون من هذا المتصفح.</p><button class="btn btn-danger btn-sm" onclick="resetDB()">إعادة ضبط جميع البيانات</button></div></section></div><div class="info-strip" style="margin-top:15px">🔐 الخصوصية: هذا الإصدار يحفظ البيانات محلياً داخل المتصفح. لا توجد مزامنة سحابية أو حسابات دخول متعددة في هذه النسخة.</div><div class="footer-note">الإصدار 1.0 · SMART X103 PRO</div>`}
document.addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());d.tax=Number(d.tax||0);db.settings={...db.settings,...d};saveDB();render();toast('تم تحديث إعدادات الورشة')}});
function exportBackup(){const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString(),app:'SMART X103 PRO'},null,2)],{type:'application/json'});downloadBlob(blob,'SMART_X103_Backup_'+dateNow()+'.json');toast('تم تجهيز النسخة الاحتياطية')}
function importBackup(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||typeof data!=='object'||!data.settings)throw new Error('invalid');if(!confirm('سيتم استبدال البيانات الحالية بالنسخة المختارة. هل تريد المتابعة؟'))return;db={...blankDB(),...data,settings:{...blankDB().settings,...data.settings}};saveDB();render();toast('تمت استعادة النسخة بنجاح')}catch(err){alert('تعذر قراءة النسخة. تأكد من اختيار ملف SMART X103 JSON صحيح.')}};reader.readAsText(file);e.target.value=''}
function resetDB(){if(!confirm('تأكيد نهائي: حذف كل البيانات من هذا الجهاز؟'))return;if(!confirm('آخر تأكيد — لا يمكن التراجع عن هذه العملية.'))return;db=blankDB();saveDB();render();toast('تمت إعادة ضبط النظام')}
function exportCSV(type){const rows=db[type]||[];if(!rows.length){toast('لا توجد بيانات للتصدير');return}const keys=Object.keys(rows[0]);const csv='\uFEFF'+[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'SMART_X103_'+type+'_'+dateNow()+'.csv')}
function downloadBlob(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function printInvoice(id){const x=db.invoices.find(i=>i.id===id);if(!x)return;const s=db.settings;const html=`<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>${x.number}</title><style>body{font-family:Arial,sans-serif;padding:35px;color:#172b42}h1{color:#0b1f36}header{display:flex;justify-content:space-between;border-bottom:3px solid #d7a928;padding-bottom:18px}.box{margin-top:25px;border:1px solid #ddd;padding:15px;border-radius:9px}.total{font-size:22px;font-weight:bold;color:#0b1f36;text-align:left;margin-top:25px}.muted{color:#667}</style><header><div><h1>${esc(s.name)}</h1><div>${esc(s.address)}</div><div>${esc(s.phone)}</div></div><div><h2>فاتورة ضريبية / مبسطة</h2><b>${esc(x.number)}</b><div>التاريخ: ${fmtDate(x.date)}</div></div></header><div class="box"><b>العميل:</b> ${esc(customerName(x.customerId))}<br><b>أمر الصيانة:</b> ${esc(x.jobId?db.jobs.find(j=>j.id===x.jobId)?.number||'—':'—')}<br><b>الحالة:</b> ${esc(x.status||'—')}</div><div class="box"><div>المبلغ قبل الضريبة: ${money(x.amount)}</div><div>الضريبة (${Number(x.tax||0)}%): ${money(Number(x.total||0)-Number(x.amount||0))}</div><div class="total">الإجمالي: ${money(x.total||x.amount)}</div></div><p class="muted">${esc(x.notes||'شكراً لثقتكم بـ SMART X103')}</p><script>window.onload=()=>window.print()<\/script></html>`;const w=window.open('','_blank');if(!w){toast('يرجى السماح بالنوافذ المنبثقة لطباعة الفاتورة');return}w.document.write(html);w.document.close()}
// Start with a clean but working system. User data is never seeded or invented.
render();
</script>
</body>
</html>
